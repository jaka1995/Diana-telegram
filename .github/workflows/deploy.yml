name: Deploy bots to Supabase

# Deploys both Telegram bots end-to-end:
#   migrations → function secrets → edge functions → webhooks → reminder cron.
#
# Add these repository secrets first (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    e.g. snsroffugjanyhhghqhp
#   SUPABASE_DB_PASSWORD    database password (Project Settings → Database)
#   BOT_TOKEN, ADMIN_BOT_TOKEN
#   WEBHOOK_SECRET, ADMIN_WEBHOOK_SECRET, CRON_SECRET
#   PROMO_CODE, IOS_URL, ANDROID_URL
#   ADMIN_CHAT_ID, ADMIN_IDS, BOT_TZ

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$REF" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Apply migrations
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Set function secrets
        run: |
          cat > .env <<EOF
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          ADMIN_BOT_TOKEN=${{ secrets.ADMIN_BOT_TOKEN }}
          WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
          ADMIN_WEBHOOK_SECRET=${{ secrets.ADMIN_WEBHOOK_SECRET }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          PROMO_CODE=${{ secrets.PROMO_CODE }}
          IOS_URL=${{ secrets.IOS_URL }}
          ANDROID_URL=${{ secrets.ANDROID_URL }}
          ADMIN_CHAT_ID=${{ secrets.ADMIN_CHAT_ID }}
          ADMIN_IDS=${{ secrets.ADMIN_IDS }}
          BOT_TZ=${{ secrets.BOT_TZ }}
          EOF
          supabase secrets set --env-file .env
          rm -f .env

      - name: Deploy edge functions
        run: |
          supabase functions deploy telegram-bot
          supabase functions deploy admin-bot
          supabase functions deploy send-reminders

      - name: Register Telegram webhooks
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_WEBHOOK_SECRET: ${{ secrets.ADMIN_WEBHOOK_SECRET }}
        run: ./scripts/set-webhook.sh

      - name: Schedule hourly reminder cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SQL=$(cat <<SQL
          do \$\$ begin perform cron.unschedule('flymind-hourly-reminders'); exception when others then null; end \$\$;
          select cron.schedule('flymind-hourly-reminders', '0 * * * *', \$\$
            select net.http_post(
              url     := 'https://${REF}.supabase.co/functions/v1/send-reminders',
              headers := jsonb_build_object('Content-Type','application/json','Authorization','Bearer ${CRON_SECRET}'),
              body    := '{}'::jsonb
            );
          \$\$);
          SQL
          )
          jq -n --arg q "$SQL" '{query:$q}' > query.json
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @query.json)
          echo "Management API status: $code"; cat resp.json
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Done
        run: echo "✅ Deployed. Test /start @FlyMindReviewBot and /menu @FlyMindAdminBot"
